<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toy shop</title>
    <link rel="stylesheet" href="./styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div>
        <!-- first navbar  -->
        <div class="container d-flex justify-content-between firstNav p-2">
            <div class="leftFisrtNav">
                <p>Welcome you to ToyShop!</p>
            </div>
            <div class="rightFirstNav">
                <div class="d-flex">
                    <button class="customNavLink" data-bs-toggle="modal" data-bs-target="#loginModal">Sign In / Join</button>
                    <div class="dropdown">
                        <button class=" dropdown-toggle customNavLink" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            USA $
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">EUR</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <li><a class="dropdown-item" href="#">USD</a></li>
                        </ul>
                    </div>
                    <div class="dropdown">
                        <button class="customNavLink dropdown-toggle" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            ENGLISH
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">English</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <li><a class="dropdown-item" href="#">FRANCIES</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <hr>
        <!-- second navbar  -->
        <div class="secondNavbar container d-flex justify-content-between">
            <!-- logo img  -->
            <div>
                <a href="#">
                    <img src="https://demo-59.woovinapro.com/wp-content/uploads/2022/02/logo.png" alt="" class=""
                        width="200" height="50">
                </a>
            </div>

            <!-- search input  -->
            <div class="input-group mb-3 w-50">
                <input type="text" class="form-control" placeholder="Recipient’s username"
                    aria-label="Recipient’s username" aria-describedby="button-addon2">
                <button class="btn btn-outline-dark customInfoBTN" type="button" id="button-addon2">Button</button>
            </div>

            <!-- icons  -->
            <div class="iconsNavbar">
                <span class="pe-4">
                    <i class="fa-solid fa-shuffle  position-relative ">
                        <span
                            class="position-absolute top-100 start-100 translate-middle  badge rounded-pill text-bg-info text-white customNotifyCount">0</span>
                    </i>
                </span>
                <span class="pe-4">

                    <i class="fa-regular fa-heart position-relative">
                        <span
                            class="position-absolute top-100 start-100 translate-middle  badge rounded-pill text-bg-info text-white customNotifyCount">0</span>

                    </i>
                </span>
                <span class="pe-4">

                    <i class="fa-solid fa-bag-shopping position-relative">
                        <span
                            class="position-absolute top-100 start-100 translate-middle  badge rounded-pill text-bg-info text-white customNotifyCount">0</span>

                    </i>
                </span>
                <span>$ 0.00</span>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg bg-info">
        <div class="container">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
   
   
   
   
   
   
   
   
   <!-- Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="btn btn-info btn-close " data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <h1 class="modal-title fs-5 text-center" id="exampleModalLabel">LOGIN</h1>

        <p class="text-center">Loretetur adipisicing elit. Pariatur!</p>

       <form>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1">
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
