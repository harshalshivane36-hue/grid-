<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Card</title>
    <!-- Importing Roboto font (used by YouTube) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0f0f0f; /* YouTube Dark Mode Background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Card Container */
        .video-card {
            width: 100%;
            max-width: 360px;
            cursor: pointer;
            text-decoration: none;
            color: #f1f1f1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Thumbnail Container */
        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background-color: #272727;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease-in-out;
        }

        /* Scale thumbnail slightly on hover */
        .video-card:hover .thumbnail-container img {
            transform: scale(1.03);
        }

        /* Video Duration Badge */
        .video-time {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            padding: 3px 4px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        /* Details Section (Avatar + Info) */
        .video-details {
            display: flex;
            gap: 12px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        /* Title with 2-line clamp */
        .video-title {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            color: #f1f1f1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Channel Name & Metadata */
        .channel-name, .video-metadata {
            font-size: 14px;
            color: #aaa;
        }

        .channel-name {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .channel-name:hover {
            color: #f1f1f1;
        }

        /* Metadata (Views & Time ago) */
        .video-metadata {
            display: flex;
            align-items: center;
        }

        .separator {
            margin: 0 4px;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <!-- YouTube Card Link -->
    <a href="https://www.youtube.com" target="_blank" class="video-card">
        
        <!-- Thumbnail Section -->
        <div class="thumbnail-container">
            <img src="https://picsum.photos/seed/ytpreview/640/360" alt="Video Thumbnail">
            <span class="video-time">14:25</span>
        </div>

        <!-- Details Section -->
        <div class="video-details">
            <!-- Channel Profile Picture -->
            <img class="channel-avatar" src="https://picsum.photos/seed/avatar123/100/100" alt="Channel Avatar">
            
            <!-- Text Content -->
            <div class="video-info">
                <h3 class="video-title">Build a Responsive YouTube Preview Card using HTML & Pure CSS</h3>
                
                <div class="channel-name">
                    Code Academy
                    <!-- Verification Badge SVG -->
                    <svg height="14" width="14" viewBox="0 0 24 24" fill="#aaa">
                        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L6 12.6l1.5-1.5 2.6 2.6 6.9-6.9 1.5 1.5-8.5 8.4z"/>
                    </svg>
                </div>

                <div class="video-metadata">
                    <span>120K views</span>
                    <span class="separator">•</span>
                    <span>2 days ago</span>
                </div>
            </div>
        </div>

    </a>

</body>
</html>
