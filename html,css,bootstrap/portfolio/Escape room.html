<!DOCTYPE html>
<html>
<head>
    <title>Escape Room Registration</title>
</head>

<body>

    <h1>Escape Room Registration</h1>
    <form>
        <label>Team Name:</label>
        <input type="text">
        <br><br>
        <label>Player Count:</label>
        <select>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
        </select>
        <br><br>
        <label>Difficulty:</label>
        <select>
            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>
        </select>
        <br><br>

        <label>Preferred Time:</label>
        <input type="time">
        <br><br>

        <h3>Player Names</h3>

        <label>Player 1:</label>
        <input type="text">
        <br><br>

        <label>Player 2:</label>
        <input type="text">
        <br><br>

        <label>Player 3:</label>
        <input type="text">
        <br><br>

        <label>Player 4:</label>
        <input type="text">
        <br><br>

        <input type="checkbox">
        <label>I agree to the rules</label>

        <br><br>

        <button type="submit">Book</button>

    </form>

</body>
