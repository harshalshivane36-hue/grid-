<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classified Mission Form</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      max-width: 550px;
      margin: 30px auto;
      padding: 25px;
      background-color: #0d1117;
      color: #00ff66;
      border: 2px solid #00ff66;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }
    h2 {
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 2px dashed #00ff66;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      text-transform: uppercase;
    }
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #00ff66;
      border-radius: 4px;
      background-color: #161b22;
      color: #00ff66;
      font-family: inherit;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #00ff66;
      color: #0d1117;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button:hover {
      background-color: #00cc52;
      box-shadow: 0 0 10px #00ff66;
    }
  </style>
</head>
<body>

  <h2>[ Classified ] Mission Briefing</h2>

  <form action="#" method="POST">
    
    <!-- Agent Name -->
    <div class="form-group">
      <label for="agent-name">Agent Codename / Name:</label>
      <input type="text" id="agent-name" name="agent_name" placeholder="e.g., Agent 007" required>
    </div>

    <!-- Mission Type -->
    <div class="form-group">
      <label for="mission-type">Mission Type:</label>
      <select id="mission-type" name="mission_type" required>
        <option value="" disabled selected>Select Mission Type</option>
        <option value="recon">Reconnaissance</option>
        <option value="infiltration">Infiltration</option>
        <option value="cyber">Cyber Espionage</option>
        <option value="extraction">VIP Extraction</option>
      </select>
    </div>

    <!-- Priority Level -->
    <div class="form-group">
      <label for="priority">Priority Level:</label>
      <select id="priority" name="priority" required>
        <option value="" disabled selected>Select Clearance Level</option>
        <option value="low">Low (Standard Field Work)</option>
        <option value="medium">Medium (Elevated Risk)</option>
        <option value="high">High (Immediate Threat)</option>
        <option value="critical">Top Secret / Critical</option>
      </select>
    </div>

    <!-- Location -->
    <div class="form-group">
      <label for="location">Target Location / Sector:</label>
      <input type="text" id="location" name="location" placeholder="e.g., Sector 7G / Zurich Base" required>
    </div>

    <!-- Equipment Checkboxes -->
    <div class="form-group">
      <label>Required Equipment:</label>
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="equip-nightvision" name="equipment[]" value="night_vision">
          <label for="equip-nightvision" style="font-weight: normal;">Night Vision Goggles</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="equip-comms" name="equipment[]" value="encrypted_comms">
          <label for="equip-comms" style="font-weight: normal;">Encrypted Radio Transceiver</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="equip-hacking" name="equipment[]" value="hacking_deck">
          <label for="equip-hacking" style="font-weight: normal;">Cyber Hacking Deck</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="equip-disguise" name="equipment[]" value="disguise_kit">
          <label for="equip-disguise" style="font-weight: normal;">Tactical Disguise Kit</label>
        </div>
      </div>
    </div>

    <!-- Mission Instructions -->
    <div class="form-group">
      <label for="instructions">Mission Instructions:</label>
      <textarea id="instructions" name="instructions" rows="4" placeholder="Enter specific objectives, contact protocols, and contingency rules..." required></textarea>
    </div>

    <!-- Accept Button -->
    <button type="submit">Accept Mission</button>

  </form>

</body>
</html>
